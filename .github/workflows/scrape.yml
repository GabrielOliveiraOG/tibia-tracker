name: Tibia Tracker Scraper

on:
  schedule:
    # Runs twice a day: 06:00 UTC (03:00 BRT) and 18:00 UTC (15:00 BRT)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Enables manual run button in GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          pip install curl_cffi supabase python-dotenv

      - name: Run Tibia Scraper (Cloudflare Bypass)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_KEY: ${{ secrets.SCRAPER_KEY }}
          SCRAPERAPIKEY: ${{ secrets.SCRAPERAPIKEY }}
        run: python scraper.py
